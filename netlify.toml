[build]
  command = "npm run build"
  publish = "dist"

# No other site may show these pages in a frame, so a signed-in admin can't be
# tricked into clicking buttons on a hidden copy of the dashboard.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Scripts may only come from this site and Cloudflare Turnstile, so injected code can't run.
    # The Supabase host must match VITE_SUPABASE_URL; the Unsplash hosts serve the old sample
    # listings' photos. Checked in report-only mode on 2026-10-08 with no violations.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gksaovhgxlxvogxsejkj.supabase.co https://images.unsplash.com https://source.unsplash.com; font-src 'self' data:; connect-src 'self' https://gksaovhgxlxvogxsejkj.supabase.co wss://gksaovhgxlxvogxsejkj.supabase.co https://api.indexnow.org https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite fingerprints everything in /assets, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
