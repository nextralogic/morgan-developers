[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints everything in /assets, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
